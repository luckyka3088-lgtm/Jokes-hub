<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke Hub</title>
    
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class = "box">
    <i class="fa-solid fa-bars fa-2xl" id = "option"></i>
    <h1>Joke Hub</h1>
    <hr>
      <div class = "joke_box">
        <p id = "smile">
          😆
        </p>
        <div id = "a">
        <hr class ="b">
        <p id = "joke_t">
          Today's Joke
        </p>
        <hr class = "b">
        </div>
        <p id = "joke"><i class="fa-solid fa-rotate-right fa-spin-snap fa-9x" style="color: rgb(44, 106, 221);" id = "spin"></i></p>
        <div id = "c">
        <button id = "next"><i class="fa-solid fa-arrows-rotate" style="color: white;"></i> Next</button>
        <button id = "copy"><i class="fa-solid fa-copy" style="color:white;"></i>Copy</button>
        </div>
      </div>
      
      <div class = "language_box">
        
        <h6><i class="fa-solid fa-globe" style="color: rgb(44, 106, 221);"></i>Choose language</h6>
        <div id = "d">
        <button class = "l" id = "Eng">English</button>
        <button class = "l" id = "hindi">हिंदी</button>
        <button class = "l" id = "guj">ગુજરાતી</button>
        </div>
      </div>
      
      <div class = "category_box">
        <h6><i class="fa-solid fa-tag" style="color: rgb(44, 106, 221);"></i>Choose catagory</h6>
        <div id = "e">
        <button class = "C" id = "fun"><i class="fa-regular fa-face-laugh" style="color: rgb(44, 106, 221);"></i>Funny</button>
        <button class = "C" id = "pro"><i class="fa-solid fa-code" style="color: rgb(44, 106, 221);"></i>Coding</button>
        <button class = "C" id = "school"><i class="fa-solid fa-school" style="color: rgb(44, 106, 221);"></i>School</button>
        </div>
      </div>
      <button class="share"><i class="fa-solid fa-share" style="color: white"></i>Share</button>
    
  </div>

    <script src="gemini.js"></script>
    <script src="script.js"></script>
</body>
</html>
